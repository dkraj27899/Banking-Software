name: CI/CD Pipeline

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  # ── Runs on every PR and push to main ──
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build shared package
        run: npm run build --workspace=shared

      - name: Type-check backend
        run: npx tsc --noEmit --project backend/tsconfig.json

      - name: Type-check frontend
        run: npx tsc --noEmit --project frontend/tsconfig.json

      - name: Run tests
        run: npm test --workspace=backend

  # ── Only deploys when a PR is merged to main ──
  deploy:
    needs: quality
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to server
        env:
          SSH_KEY_B64: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY_B64" | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H 202.61.199.55 >> ~/.ssh/known_hosts 2>/dev/null
          ssh -i ~/.ssh/deploy_key root@202.61.199.55 'cd /opt/bccs/repo && git pull origin main && cd /opt/bccs && docker compose -f docker-compose.prod.yml build backend && docker compose -f docker-compose.prod.yml build frontend && docker compose -f docker-compose.prod.yml up -d backend frontend && sleep 5 && curl -sf http://127.0.0.1:3001/api/health && docker image prune -f && echo "Deploy complete"'
