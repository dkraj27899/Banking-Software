name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── Stage 1: Lint, Type-check, Test ──
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build shared package
        run: npm run build --workspace=shared

      - name: Type-check backend
        run: npx tsc --noEmit --project backend/tsconfig.json

      - name: Type-check frontend
        run: npx tsc --noEmit --project frontend/tsconfig.json

      - name: Run tests
        run: npm test --workspace=backend

  # ── Stage 2: Deploy to Production ──
  deploy:
    needs: quality
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SERVER_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H 202.61.199.55 >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy to server
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no root@202.61.199.55 'bash -s' << 'EOF'
          set -e

          echo "── Pulling latest code ──"
          cd /opt/bccs/repo
          git pull origin main

          echo "── Building backend ──"
          cd /opt/bccs
          docker compose -f docker-compose.prod.yml build backend

          echo "── Building frontend ──"
          docker compose -f docker-compose.prod.yml build frontend

          echo "── Restarting services ──"
          docker compose -f docker-compose.prod.yml up -d backend frontend

          echo "── Waiting for backend health ──"
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:3001/api/health > /dev/null 2>&1; then
              echo "Backend healthy!"
              break
            fi
            echo "Waiting... ($i/30)"
            sleep 2
          done

          echo "── Cleaning up old images ──"
          docker image prune -f

          echo "── Deploy complete ──"
          EOF
