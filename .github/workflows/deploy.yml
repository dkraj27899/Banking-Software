name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/bccs-backend
  FRONTEND_IMAGE: ghcr.io/${{ github.repository_owner }}/bccs-frontend

jobs:
  # ── Stage 1: Lint, Type-check, Test ──
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build shared package
        run: npm run build --workspace=shared

      - name: Type-check backend
        run: npx tsc --noEmit --project backend/tsconfig.json

      - name: Type-check frontend
        run: npx tsc --noEmit --project frontend/tsconfig.json

      - name: Run tests
        run: npm test --workspace=backend

  # ── Stage 2: Build & Push Docker Images ──
  build:
    needs: quality
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:latest
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          build-args: |
            VITE_API_BASE_URL=${{ secrets.VITE_API_BASE_URL }}
            VITE_FIREBASE_API_KEY=${{ secrets.VITE_FIREBASE_API_KEY }}
            VITE_FIREBASE_AUTH_DOMAIN=${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
            VITE_FIREBASE_PROJECT_ID=${{ secrets.VITE_FIREBASE_PROJECT_ID }}
            VITE_FIREBASE_APP_ID=${{ secrets.VITE_FIREBASE_APP_ID }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  # ── Stage 3: Deploy to Production ──
  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SERVER_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H 202.61.199.55 >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy to server
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no root@202.61.199.55 << 'DEPLOY_SCRIPT'
            set -e

            echo "── Logging in to GHCR ──"
            echo "${GHCR_TOKEN}" | docker login ghcr.io -u dkraj27899 --password-stdin || true

            echo "── Pulling latest images ──"
            docker pull ghcr.io/dkraj27899/bccs-backend:latest
            docker pull ghcr.io/dkraj27899/bccs-frontend:latest

            docker tag ghcr.io/dkraj27899/bccs-backend:latest bccs-backend:latest
            docker tag ghcr.io/dkraj27899/bccs-frontend:latest bccs-frontend:latest

            echo "── Restarting services ──"
            cd /opt/bccs
            docker compose -f docker-compose.prod.yml up -d backend frontend

            echo "── Waiting for backend health ──"
            for i in $(seq 1 30); do
              if curl -sf http://127.0.0.1:3001/api/health > /dev/null 2>&1; then
                echo "Backend healthy!"
                break
              fi
              echo "Waiting... ($i/30)"
              sleep 2
            done

            echo "── Cleaning up old images ──"
            docker image prune -f

            echo "── Deploy complete ──"
          DEPLOY_SCRIPT
