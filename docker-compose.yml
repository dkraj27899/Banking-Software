services:
  postgres:
    image: postgres:16-alpine
    container_name: bccs_postgres
    environment:
      POSTGRES_DB: bccs_dev
      POSTGRES_USER: bccs_dev
      POSTGRES_PASSWORD: bccs_dev_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bccs_dev -d bccs_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: bccs_redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  redisdata:
